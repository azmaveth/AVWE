name: CI

# Everything here runs for every pull request and for master. The same lint
# steps run locally as `mix lint` (the pre-commit hook), Dialyzer and Sobelow
# as the pre-push hook; the tests only run here and on demand (`mix test`).
# Dependency advisories are in audit.yml.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir

      - name: Formatting
        run: mix format --check-formatted
      - name: Unused dependencies in mix.lock
        run: mix deps.unlock --check-unused
      - name: Compile, warnings as errors
        run: mix compile --warnings-as-errors --force
      - name: Credo
        run: mix credo --strict

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: test

      # The tests do not need the web client's script and stylesheet, but
      # this is where a bundle that no longer builds is found.
      - name: Build the web client's assets
        run: mix assets.setup && mix assets.build

      - name: Tests
        run: mix test --warnings-as-errors

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-elixir

      # Building the PLTs takes the better part of a minute; the cache makes
      # it a few seconds, and a changed mix.lock only adds what is new.
      - name: Cache PLTs
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-

      - name: Build PLTs
        run: mix dialyzer --plt
      - name: Dialyzer
        run: mix dialyzer --format github

  sobelow:
    name: Sobelow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-elixir

      - name: Sobelow
        run: scripts/sobelow
